<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="460" fill="#0d1117"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Row 1: raw inputs -->
  <rect x="20" y="40" width="190" height="60" rx="8" fill="#1f6feb" opacity="0.15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="115" y="65" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Raw Sales Data</text>
  <text x="115" y="83" fill="#8b949e" font-size="11" text-anchor="middle">CSV / database export</text>

  <rect x="20" y="360" width="190" height="60" rx="8" fill="#1f6feb" opacity="0.15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="115" y="385" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Raw Inventory Data</text>
  <text x="115" y="403" fill="#8b949e" font-size="11" text-anchor="middle">CSV / database export</text>

  <!-- Arrows into Python cleaning -->
  <path d="M210,70 L330,165" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M210,390 L330,255" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Python cleaning -->
  <rect x="340" y="165" width="220" height="90" rx="8" fill="#238636" opacity="0.18" stroke="#2ea043" stroke-width="1.5"/>
  <text x="450" y="195" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Python</text>
  <text x="450" y="216" fill="#e6edf3" font-size="13" text-anchor="middle">Cleaning, Transformation</text>
  <text x="450" y="234" fill="#e6edf3" font-size="13" text-anchor="middle">and Joins</text>

  <!-- Arrow to analysis-ready dataset -->
  <path d="M560,210 L680,210" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Analysis ready dataset -->
  <rect x="690" y="165" width="200" height="90" rx="8" fill="#9e6a03" opacity="0.18" stroke="#d29922" stroke-width="1.5"/>
  <text x="790" y="200" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Analysis Ready</text>
  <text x="790" y="220" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Dataset</text>
  <text x="790" y="240" fill="#8b949e" font-size="11" text-anchor="middle">retail_analysis_dataset.csv</text>

  <!-- Split arrows to SQL and Tableau -->
  <path d="M890,195 L990,110" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M890,225 L990,310" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- SQL analysis -->
  <rect x="1000" y="65" width="180" height="80" rx="8" fill="#8957e5" opacity="0.18" stroke="#a371f7" stroke-width="1.5"/>
  <text x="1090" y="95" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">SQL Analysis</text>
  <text x="1090" y="115" fill="#8b949e" font-size="11" text-anchor="middle">MySQL queries on</text>
  <text x="1090" y="130" fill="#8b949e" font-size="11" text-anchor="middle">revenue, margin, risk</text>

  <!-- Tableau dashboards -->
  <rect x="1000" y="265" width="180" height="80" rx="8" fill="#db6d28" opacity="0.18" stroke="#e8590c" stroke-width="1.5"/>
  <text x="1090" y="295" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">Tableau Dashboards</text>
  <text x="1090" y="315" fill="#8b949e" font-size="11" text-anchor="middle">KPI and risk</text>
  <text x="1090" y="330" fill="#8b949e" font-size="11" text-anchor="middle">visualizations</text>

  <!-- Converge to insights -->
  <path d="M1000,130 L730,330" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1000,305 L730,345" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Business insights -->
  <rect x="540" y="320" width="190" height="80" rx="8" fill="#cf222e" opacity="0.18" stroke="#f85149" stroke-width="1.5"/>
  <text x="635" y="350" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">Business Insights</text>
  <text x="635" y="370" fill="#8b949e" font-size="11" text-anchor="middle">Performance and</text>
  <text x="635" y="385" fill="#8b949e" font-size="11" text-anchor="middle">risk findings</text>

  <!-- Arrow to recommendations -->
  <path d="M540,360 L420,360" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Recommendations -->
  <rect x="220" y="320" width="190" height="80" rx="8" fill="#1a7f37" opacity="0.20" stroke="#3fb950" stroke-width="1.5"/>
  <text x="315" y="350" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">Recommendations</text>
  <text x="315" y="370" fill="#8b949e" font-size="11" text-anchor="middle">Replenishment,</text>
  <text x="315" y="385" fill="#8b949e" font-size="11" text-anchor="middle">markdowns, supplier moves</text>
</svg>
